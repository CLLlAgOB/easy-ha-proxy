[package]
name = "guardd-core"
version = "0.1.0"
edition = "2021"
description = "High-throughput Rust log parsing, signature matching, and bounded IP/subnet tracking core for easy-ha-proxy-guardd"
license = "MIT"

[lib]
name = "guardd_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "guardd-core"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1"
libc = "0.2"
memchr = "2.7"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
