---
# roles/docker/tasks/main.yml
#
# The Go installer runs docker.yml (with live_restore.yml and mirror.yml) when
# the installed agent has it; otherwise it is included from here (see
# roles/haproxy-admin/tasks/go_part.yml). The mirror's Docker restart is done
# in place, as the task file's flush_handlers does, so no handler comes back.
- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: [docker/docker]

- ansible.builtin.include_tasks:
    file: docker.yml
    apply:
      tags: [always]
  when: "'docker/docker' not in (go_agent_part_names | default([]))"
