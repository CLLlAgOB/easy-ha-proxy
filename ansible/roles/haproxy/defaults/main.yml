###############################################################################
# Role: ansible-haproxy-flex -- defaults/main.yml
# Every value can be overridden in host_vars or group_vars.
###############################################################################

######## 1. Base paths ######################################################
haproxy_certs_dir: "/etc/haproxy/certs"     # where the fullchain+privkey *.pem files go
haproxy_certs_available_dir: "/etc/haproxy/certs-available"  # spares; HAProxy does not read them
haproxy_mtls_dir: "/etc/haproxy/mtls"      # clients' public CAs, issuer lists and revocation lists
haproxy_socket: "/run/haproxy/admin.sock"
haproxy_socket_group: "hadmin"
# The web UI owns these three runtime source files after the initial seed.
# They are read into a private namespace by the config stage; they are never
# imported wholesale as Ansible variables because vars.yml also contains
# installer-owned values such as the selected container image.
haproxy_runtime_config_dir: "/opt/haproxy-admin/config"
# null = chosen from the number of vCPUs available, but not above max.
haproxy_nbthread: null
haproxy_nbthread_max: 2
######## 2. The /stats admin page ###############################################
admin_domain: null                          # for example: ha.example.com
admin_allowed_ips: []                       # a list of IPs; empty => open to everyone
admin_password: "changeme"                  # a bcrypt/sha-256 hash or plain text
admin_ips_file: "/etc/haproxy/admin.allow"  # addresses allowed in
admin_dyn_state: "/var/lib/haproxy/admin-dyn-ip.state" # kept for use with dynamic DNS
admin_dyn_timer_interval: "5min"      # how often to check the DNS
admin_dyn_hostname: null    # where the dynamic IP comes from
admin_dyn_enabled: false    # dynamic DNS on/off

######## 3. Service frontends ################################################
enable_http80: false                        # true -> the frontend fe_http80 is created
export_prometheus: false                    # true -> listen stats_prom with /metrics
prometheus_port: 8404

######## 4. Global site defaults #########################################
site_defaults:
  # — LB / sticky —
  balance: "roundrobin"                     # roundrobin | leastconn | source …
  sticky: "none"                            # cookie | ip | none

  # — backend connection —
  backend_port: 80                          # when a server has no port of its own
  backend_ssl: false                        # TLS to the backend
  backend_ssl_verify: true                  # verify the backend's certificate
  backend_ssl_ca: ""                        # a custom CA for verify
  backend_ssl_sni: ""                       # the default is the domain

  # — HTTPS redirect & maintenance —
  redirect_to_https: true                   # 301 from port 80
  maintenance: false                        # traffic goes to be_maintenance

  # — Security & performance —
  hsts: 15552000                            # seconds; 180 days, 0 disables HSTS
  compress: false                           # gzip html/css/js
  add_headers: {}                           # arbitrary set-header pairs

  # — Rate-limit & ban —
  max_req_rate: 200                           # 0 => no limit
  rate_window: "20s"
  rate_ban: false                           # put the IP in tbl_ban when the limit is exceeded
  rate_errors: 8                            # global automatic ban above N 4xx per rate_window

  # — Geo filter —
  # The top-level enable_geoip remains the master switch. Individual sites may
  # override this default with `geo` and may narrow the global country list with
  # `geo_countries`.
  enable_geoip: true

######## 5. The list of sites (OVERRIDE it in group_vars/host_vars) #############
sites: []
# the shape:
#   - name: blog
#     domain: blog.example.com
#     backend_ip: 10.0.0.10
#     servers:
#       - { name: app1, host: 10.0.0.10, port: 8881 }

######## 6. GeoIP, global ###################################################
enable_geoip: false         # opt-in: old configs without this key stay unrestricted
# Mode: allow (only the allowed countries) or deny (everyone but the allowed countries)
geoip_mode: "allow"  # allow | deny

######## 7. Certbot (read by a separate role) ######################################
certbot_email: "admin@example.com"

######## 8. AppArmor for rsyslog -> the socket in HAProxy's chroot ########
haproxy_chroot: "/var/lib/haproxy"

# Let rsyslogd use /var/lib/haproxy/dev/log automatically
haproxy_enable_rsyslog_apparmor: true

######## 9. Keeping the servers' administrative state ########
# Ready/Drain/Maintenance and the runtime weight live only in the running
# process. Without this file, saving any site -- which reloads -- would
# silently put a server in maintenance back under load.
#
# The flip side: the state sticks across a reboot of the machine too.
# A forgotten MAINT survives a reboot; it shows on the Backends page.
haproxy_server_state_enabled: true
haproxy_server_state_file: "{{ haproxy_chroot }}/server-state"
# The timer covers crash restarts and applies through Ansible; a normal
# reload from the UI dumps the state itself, right before it reloads.
haproxy_server_state_interval: "60s"

# --- Prometheus export ---
# Off by default: Prometheus is never a required service here. When it is
# switched on, /metrics on the admin domain is let past Authelia for the
# sources below and the application still demands a bearer token. Keep the
# list as narrow as the scraper actually needs; the default is this host.
metrics_export_enabled: false
metrics_scrape_sources:
  - 127.0.0.1

# --- Request identifier ---
# One identifier per request, minted at the edge, written to the access log,
# forwarded upstream as X-Request-ID and returned to the client. A supplied
# header is always discarded first: two requests sharing an identifier make
# the log worse, not better.
request_id_enabled: true

# --- User-Agent in the access log ---
# Logged as one word (anything that could split the line becomes "_"), cut to
# 128 characters. Scanners often name themselves -- sqlmap, nikto, zgrab --
# and the adaptive protection engine bans on that. Costs roughly a fifth to
# a half more log volume; set to false to leave it out.
log_user_agent: true
