---
# roles/haproxy/tasks/go_protection.yml
#
# The package protection the first play runs before anything else: the Go
# installer runs protection.yml when the installed agent has it, else the
# task file is included (see roles/haproxy-admin/tasks/go_fallback.yml).
- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: [haproxy/protection]

- ansible.builtin.include_tasks:
    file: protection.yml
    apply:
      tags: [always]
  when: "'haproxy/protection' not in (go_agent_part_names | default([]))"
