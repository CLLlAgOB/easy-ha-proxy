# The task files the Go installer may run go through go_fallback.yml (the
# agent runs them and hands back the handlers they notified, or else the task
# file is included); every other one is imported as it is. A test keeps the
# list equal to the haproxy role entries among go_installer_parts.
- import_tasks: >-
    {{ 'go_fallback.yml' if task_stage in ['install', 'apparmor', 'config', 'addadmin'] else task_stage ~ '.yml' }}
