---
# roles/haproxy/tasks/go_fallback.yml
#
# A haproxy role entry whose task file the Go installer may run (main.yml
# sends it here): the agent runs it, or else the task file is included (see
# roles/haproxy-admin/tasks/go_fallback.yml for the include and its tags).
# The handlers the agent's steps notified are notified here, so Ansible runs
# them at the end of the play exactly as for its own tasks: HAProxy must not
# reload before config.yml has written haproxy.cfg on a fresh install.

- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: ["haproxy/{{ task_stage }}"]

- name: "haproxy/{{ task_stage }} | Hand the notified handler to Ansible: apply haproxy"
  ansible.builtin.debug:
    msg: The Go installer changed a file HAProxy reads; HAProxy reloads at the end of the play.
  changed_when: true
  notify: apply haproxy
  when: >-
    'apply haproxy' in ((go_part_result.stdout_lines | default(['{}']) | last | from_json).notified | default([]))

- name: "haproxy/{{ task_stage }} | Hand the notified handler to Ansible: apparmor rsyslogd reload"
  ansible.builtin.debug:
    msg: The Go installer changed the rsyslogd AppArmor override; it is reloaded at the end of the play.
  changed_when: true
  notify: apparmor rsyslogd reload
  when: >-
    'apparmor rsyslogd reload' in ((go_part_result.stdout_lines | default(['{}']) | last | from_json).notified | default([]))

- ansible.builtin.include_tasks:
    file: "{{ task_stage }}.yml"
    apply:
      tags: [always]
  when: ('haproxy/' ~ task_stage) not in (go_agent_part_names | default([]))
