---
# Installing all of haproxy-admin's helper daemons in one stage. native.yml
# installs the agent itself and stays with Ansible; the others run with the
# Go installer when the agent has them (go_part.yml).

- import_tasks: native.yml
# alertd before the producers, as before. One Go installer call for all of
# them; each one it does not run is included from its task file.
- import_tasks: go_part.yml
  vars:
    go_parts: [certd, controld, backupd, updated, alertd, metricsd, guardd, healthd]
- include_tasks: {file: certd.yml, apply: {tags: [always]}}
  when: "'certd' not in (go_agent_part_names | default([]))"
- include_tasks: {file: controld.yml, apply: {tags: [always]}}
  when: "'controld' not in (go_agent_part_names | default([]))"
- include_tasks: {file: backupd.yml, apply: {tags: [always]}}
  when: "'backupd' not in (go_agent_part_names | default([]))"
- include_tasks: {file: updated.yml, apply: {tags: [always]}}
  when: "'updated' not in (go_agent_part_names | default([]))"
- include_tasks: {file: alertd.yml, apply: {tags: [always]}}
  when: "'alertd' not in (go_agent_part_names | default([]))"
- include_tasks: {file: metricsd.yml, apply: {tags: [always]}}
  when: "'metricsd' not in (go_agent_part_names | default([]))"
- include_tasks: {file: guardd.yml, apply: {tags: [always]}}
  when: "'guardd' not in (go_agent_part_names | default([]))"
- include_tasks: {file: healthd.yml, apply: {tags: [always]}}
  when: "'healthd' not in (go_agent_part_names | default([]))"
