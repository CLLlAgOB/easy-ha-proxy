---
# Install and configure the root-owned haproxy-certd daemon.

- name: "haproxy-certd | Install runtime packages"
  ansible.builtin.package:
    name:
      - openssl
    state: present
  tags: restore-network

- import_tasks: dns-plugins.yml

- name: "haproxy-certd | Install systemd unit"
  ansible.builtin.template:
    src: haproxy-certd.service.j2
    dest: /etc/systemd/system/haproxy-certd.service
    owner: root
    group: root
    mode: "0644"
  register: certd_unit

# dns-route53 has no per-lineage credentials option. The snap's timer
# therefore uses certd's renewal mode to select each lineage's AWS profile.
- name: "haproxy-certd | Ensure the Certbot renewal override directory"
  ansible.builtin.file:
    path: /etc/systemd/system/snap.certbot.renew.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "haproxy-certd | Bind automatic renewal to saved DNS profiles"
  ansible.builtin.template:
    src: certbot-renew.service.conf.j2
    dest: /etc/systemd/system/snap.certbot.renew.service.d/easy-ha-proxy.conf
    owner: root
    group: root
    mode: "0644"
  register: certbot_renew_unit

- name: "haproxy-certd | systemd daemon-reload if unit changed"
  ansible.builtin.systemd:
    daemon_reload: yes
  when: certd_unit.changed or certbot_renew_unit.changed

- name: "haproxy-certd | Enable service"
  ansible.builtin.systemd:
    name: haproxy-certd.service
    enabled: yes

- name: "haproxy-certd | Restart service if changed"
  ansible.builtin.systemd:
    name: haproxy-certd.service
    state: restarted
  when: certd_unit.changed or (daemons_env_t.changed | default(false))

- name: "haproxy-certd | Ensure service started"
  ansible.builtin.systemd:
    name: haproxy-certd.service
    state: started

# The certificate delivery worker certbot's 906 hook runs, and that certd
# calls when the operator asks to send a certificate now: the agent, under the
# name both callers use.
- name: Install the certificate delivery worker
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by easy-ha-proxy: certbot's 906 deploy hook and certd run this.
      exec {{ native_agent_bin | default('/usr/local/sbin/easy-ha-proxy-agent') }} cert-deliver "$@"
    dest: /usr/local/sbin/easy-ha-proxy-cert-deliver
    owner: root
    group: root
    mode: "0755"

- name: Ensure certificate delivery targets directory exists
  ansible.builtin.file:
    path: /etc/easy-ha-proxy/cert-destinations
    state: directory
    owner: root
    group: root
    mode: "0700"
