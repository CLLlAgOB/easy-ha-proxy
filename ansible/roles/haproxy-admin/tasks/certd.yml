---
# Install and configure the root-owned haproxy-certd daemon.

- name: "haproxy-certd | Install runtime packages"
  ansible.builtin.package:
    name:
      - python3
      - python3-yaml
      - python3-cryptography
      - openssl
    state: present
  tags: restore-network

- import_tasks: dns-plugins.yml

- name: "haproxy-certd | Install script"
  ansible.builtin.copy:
    src: haproxy-certd.py
    dest: /usr/local/sbin/haproxy-certd.py
    owner: root
    group: root
    mode: "0755"
  register: certd_script

- name: "haproxy-certd | Install systemd unit"
  ansible.builtin.template:
    src: haproxy-certd.service.j2
    dest: /etc/systemd/system/haproxy-certd.service
    owner: root
    group: root
    mode: "0644"
  register: certd_unit

- name: "haproxy-certd | systemd daemon-reload if unit changed"
  ansible.builtin.systemd:
    daemon_reload: yes
  when: certd_unit.changed

- name: "haproxy-certd | Enable service"
  ansible.builtin.systemd:
    name: haproxy-certd.service
    enabled: yes

- name: "haproxy-certd | Restart service if changed"
  ansible.builtin.systemd:
    name: haproxy-certd.service
    state: restarted
  when: certd_script.changed or certd_unit.changed

- name: "haproxy-certd | Ensure service started"
  ansible.builtin.systemd:
    name: haproxy-certd.service
    state: started

# The worker certbot's 906 hook runs, and that certd calls when the operator
# asks to send a certificate now. It lives with the other helpers rather than
# in the cert role, whose files/ directory is not tracked.
- name: Install the certificate delivery worker
  ansible.builtin.copy:
    src: easy-ha-proxy-cert-deliver.py
    dest: /usr/local/sbin/easy-ha-proxy-cert-deliver
    owner: root
    group: root
    mode: "0755"

- name: Ensure certificate delivery targets directory exists
  ansible.builtin.file:
    path: /etc/easy-ha-proxy/cert-destinations
    state: directory
    owner: root
    group: root
    mode: "0700"
