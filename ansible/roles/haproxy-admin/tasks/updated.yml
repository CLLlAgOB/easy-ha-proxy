---
# A dedicated root broker exposes only structured update checks and a fixed
# component allowlist to the unprivileged web application.

- name: "easy-ha-proxy-updated | Install the distribution APT reader"
  ansible.builtin.apt:
    name: python3-apt
    state: present
  when: ansible_os_family == 'Debian'

- name: "easy-ha-proxy-updated | Ensure persistent job directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ app_group }}"
    mode: "0750"
  loop:
    - "{{ updated_state_root }}"
    - "{{ updated_jobs_dir }}"

- name: "easy-ha-proxy-updated | Install systemd unit"
  ansible.builtin.template:
    src: easy-ha-proxy-updated.service.j2
    dest: /etc/systemd/system/easy-ha-proxy-updated.service
    owner: root
    group: root
    mode: "0644"
  register: updated_unit

- name: "easy-ha-proxy-updated | Reload systemd when unit changed"
  ansible.builtin.systemd:
    daemon_reload: true
  when: updated_unit.changed

# The broker runs from the shared agent binary. native.yml restarts the
# other agent units when that binary is replaced but leaves this one to the
# rules below: a replaced binary must not keep the old broker running from a
# deleted file until the next reboot.
- name: "easy-ha-proxy-updated | Note a replaced native agent binary"
  ansible.builtin.set_fact:
    updated_binary_changed: "{{ (_native_agent_copy | default({})) is changed }}"

- name: "easy-ha-proxy-updated | Inspect active update marker"
  ansible.builtin.stat:
    path: "{{ updated_active_marker }}"
    follow: false
  register: updated_active

- name: "easy-ha-proxy-updated | Defer self restart during an active update"
  ansible.builtin.file:
    path: "{{ updated_restart_request_marker }}"
    state: touch
    owner: root
    group: "{{ app_group }}"
    mode: "0600"
  when:
    - updated_active.stat.exists
    - updated_unit.changed or updated_binary_changed | bool or (daemons_env_t.changed | default(false))

- name: "easy-ha-proxy-updated | Enable service"
  ansible.builtin.systemd:
    name: easy-ha-proxy-updated.service
    enabled: true

- name: "easy-ha-proxy-updated | Restart changed service outside an update"
  ansible.builtin.systemd:
    name: easy-ha-proxy-updated.service
    state: restarted
  when:
    - not updated_active.stat.exists
    - updated_unit.changed or updated_binary_changed | bool or (daemons_env_t.changed | default(false))

- name: "easy-ha-proxy-updated | Ensure service is started"
  ansible.builtin.systemd:
    name: easy-ha-proxy-updated.service
    state: started
