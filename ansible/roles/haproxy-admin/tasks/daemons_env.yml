---
- name: Ensure /etc/easy-ha-proxy directory exists for daemon token file
  ansible.builtin.file:
    path: "{{ (daemons_env_file | default('/etc/easy-ha-proxy/daemons.env')) | dirname }}"
    state: directory
    owner: root
    group: root
    # Only root reads it; the installer and the cert role keep it 0700 too,
    # so the stages no longer flip it between modes.
    mode: "0700"

- name: Render root-only daemon IPC token file
  ansible.builtin.template:
    src: daemons.env.j2
    dest: "{{ daemons_env_file | default('/etc/easy-ha-proxy/daemons.env') }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  register: daemons_env_t
