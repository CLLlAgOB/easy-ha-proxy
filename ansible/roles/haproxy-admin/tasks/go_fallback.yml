---
# roles/haproxy-admin/tasks/go_fallback.yml
#
# A role entry whose own task file the Go installer may run (main.yml sends
# it here): the agent runs it, or else the task file is included. The include
# is dynamic so a part the agent ran costs one skipped task, not every task of
# its file. apply: tags [always] lets the included tasks run whenever this
# entry runs, as the static import did through the entry's tags; their own
# tags still count for --skip-tags (an offline restore skips restore-network),
# and none of these task files has a never-tagged task.

- ansible.builtin.import_tasks: go_part.yml
  vars:
    go_parts: ["{{ task_stage }}"]

- ansible.builtin.include_tasks:
    file: "{{ task_stage }}.yml"
    apply:
      tags: [always]
  when: task_stage not in (go_agent_part_names | default([]))
