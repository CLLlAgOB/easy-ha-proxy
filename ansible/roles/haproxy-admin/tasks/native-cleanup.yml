---
# Gateways installed before the Python implementation was removed still carry
# its scripts and packages, and the Rust library only it loaded. Nothing runs
# them once every unit starts the native binaries, so they go -- but only
# here, at the end of the run, and only when no installed unit names any of
# them. Removed in the native stage, a run that stopped half way (a failed
# certificate, a refused HAProxy configuration) or one limited to some tags
# left units of the earlier version pointing at scripts that were gone, the
# update broker's own among them. All or nothing: a daemon a unit still
# starts also imports the shared files beside it (the alert client), which
# no unit names.
- name: "native-cleanup | Remove the former Python daemons once no installed unit names them"
  vars:
    native_legacy_paths:
      - /usr/local/sbin/easy-ha-proxy-alertd.py
      - /usr/local/sbin/easy_ha_proxy_alert_client.py
      - /usr/local/sbin/easy-ha-proxy-backupd.py
      - /usr/local/sbin/easy-ha-proxy-backup-run.py
      - /usr/local/sbin/easy-ha-proxy-unit-failed.py
      - /usr/local/sbin/easy-ha-proxy-guardd.py
      - /usr/local/sbin/easy-ha-proxy-metricsd.py
      - /usr/local/sbin/easy-ha-proxy-updated.py
      - /usr/local/sbin/haproxy-certd.py
      - /usr/local/sbin/haproxy-controld.py
      - /usr/local/sbin/haproxy-healthd.py
      - /usr/local/sbin/haproxy-udp-forward.py
      - /usr/local/sbin/authelia-bansd.py
      - /usr/local/sbin/authelia-configd.py
      - /usr/local/sbin/authelia-usersd.py
      - /usr/local/sbin/backupd
      - /usr/local/sbin/certd
      - /usr/local/sbin/controld
      - /usr/local/sbin/guardd
      - /usr/local/sbin/metricsd
      - /usr/local/sbin/updated
      - /usr/local/sbin/__pycache__
      - /usr/local/lib/easy-ha-proxy/libguardd_core.so
  ansible.builtin.shell: |
    set -euo pipefail
    present=()
    found=0
    named=""
    for path in {{ native_legacy_paths | map('quote') | join(' ') }}; do
      [ -e "$path" ] || [ -L "$path" ] || continue
      present+=("$path")
      found=$((found + 1))
      if grep -rqsF -- "$path" /etc/systemd/system /run/systemd/system /usr/lib/systemd/system; then
        named="$named $path"
      fi
    done
    if [ -n "$named" ]; then
      echo "kept the former Python daemons: installed units still name$named" >&2
      exit 0
    fi
    if [ "$found" -gt 0 ]; then
      rm -rf -- "${present[@]}"
      echo "removed: ${present[*]}"
    fi
  args:
    executable: /bin/bash
  register: native_cleanup
  changed_when: "'removed:' in native_cleanup.stdout"
