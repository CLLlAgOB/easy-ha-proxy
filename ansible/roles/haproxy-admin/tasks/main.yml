# The task files the Go installer may run go through go_fallback.yml (the
# agent runs them, or else the task file is included); every other task file
# is imported as it is. The list is go_installer_parts of defaults/main.yml,
# written out because a static import's name is templated from the role
# parameters alone (a test keeps the two equal).
- import_tasks: >-
    {{ 'go_fallback.yml'
       if task_stage in ['native', 'getuseruid', 'packages', 'fs', 'config', 'start', 'native-cleanup',
                         'daemons_env', 'certd', 'controld', 'backupd', 'iptables-ban', 'iptables-udp',
                         'updated', 'alertd', 'metricsd', 'guardd', 'healthd', 'journald-retention',
                         'update_haproxy_admin']
       else task_stage ~ '.yml' }}
