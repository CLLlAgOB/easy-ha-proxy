---
# roles/haproxy-admin/tasks/go_part.yml
#
# Hands task files (go_parts, a list, run in order) to the Go installer during
# the hybrid period. The installed agent lists what it can run ("easy-ha-proxy-
# agent apply parts"); it runs those parts in one call, checking every step
# against the host and changing only what differs, exactly as the task files
# would. Whatever it does not run (an older binary early in an update, or
# easy_ha_proxy_go_installer: false) the caller includes from its task file,
# under the condition "<part> not in go_agent_part_names".
#
# Kept to one executed task per call on purpose: on the ARM gateways every
# executed Ansible task costs seconds, a skipped one a fraction of that.

- name: "{{ go_parts | join(', ') }} | Ask the Go installer which parts it runs"
  ansible.builtin.command:
    argv:
      - "{{ native_agent_bin | default('/usr/local/sbin/easy-ha-proxy-agent') }}"
      - apply
      - parts
  register: go_agent_parts_probe
  changed_when: false
  failed_when: false
  check_mode: false
  # Once per run, and again after the native stage replaced the binary.
  when:
    - easy_ha_proxy_go_installer | default(true) | bool
    - >-
      go_agent_part_names is not defined
      or ((_native_agent_copy | default({})) is changed and not (go_agent_parts_after_native | default(false)))

- name: "{{ go_parts | join(', ') }} | Remember the parts the Go installer runs"
  ansible.builtin.set_fact:
    go_agent_parts: "{{ _go_parsed }}"
    go_agent_part_names: "{{ _go_parsed.keys() | list }}"
    go_agent_parts_after_native: "{{ (_native_agent_copy | default({})) is changed }}"
  vars:
    _go_parsed: >-
      {{
        (go_agent_parts_probe.stdout | from_json).parts
        if (go_agent_parts_probe.rc | default(1)) == 0 and (go_agent_parts_probe.stdout | default('')) is match('[{]')
        else {}
      }}
  when: go_agent_parts_probe is not skipped

- name: "{{ go_parts | join(', ') }} | Run with the Go installer"
  ansible.builtin.command:
    argv: >-
      {%- set parts = go_parts | select('in', go_agent_part_names | default([])) | list -%}
      {%- set argv = [native_agent_bin | default('/usr/local/sbin/easy-ha-proxy-agent'), 'apply',
                      ('plan' if ansible_check_mode else 'run'), '--task-stage', task_stage] -%}
      {%- set reads = [] -%}
      {%- for part in parts -%}
      {%-   set _ = argv.extend(['--part', part]) -%}
      {%-   set _ = reads.extend(go_agent_parts[part].reads) -%}
      {%- endfor -%}
      {%- for name in reads | unique -%}
      {%-   set result = lookup('vars', name, default={}) -%}
      {%-   if result is mapping and (result.changed | default(false) | bool) -%}
      {%-     set _ = argv.extend(['--changed', name]) -%}
      {%-   endif -%}
      {%- endfor -%}
      {%- for tag in ansible_skip_tags | default([]) -%}
      {%-   set _ = argv.extend(['--skip-tag', tag]) -%}
      {%- endfor -%}
      {%- for name in go_installer_forwarded_vars -%}
      {#-   lookup's default=none means "no default": a sentinel instead -#}
      {%-   set value = lookup('vars', name, default='__go_unset__') -%}
      {%-   if value != '__go_unset__' -%}
      {%-     set _ = argv.extend(['--extra', name ~ '=' ~ value]) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ argv }}
  register: go_part_result
  changed_when: (go_part_result.stdout_lines | last | from_json).changed
  check_mode: false
  when: go_parts | select('in', go_agent_part_names | default([])) | list | length > 0

- name: "{{ go_parts | join(', ') }} | Show what the Go installer changed"
  ansible.builtin.debug:
    msg: "{{ go_part_result.stdout_lines[:-1] | reject('match', '^(ok|skipped) ') | list }}"
  when: go_part_result is changed

# Only the results another task file reads come back as facts (exports); no
# Ansible task reads the others.
- name: "{{ go_parts | join(', ') }} | Keep what other parts read"
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ {'changed': item.value} }}"
  loop: "{{ (go_part_result.stdout_lines | last | from_json).exports | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - go_part_result is not skipped
    - (go_part_result.stdout_lines | last | from_json).exports | length > 0
