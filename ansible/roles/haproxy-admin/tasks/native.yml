---
# roles/haproxy-admin/tasks/native.yml
# Installation of the precompiled Rust (guardd-core) and Go
# (easy-ha-proxy-agent) host binaries for x86_64 (amd64) and aarch64 (arm64).
# Delivery priority:
#   1. native_local_bundle_dir (air-gapped local tarball)
#   2. native_release_base_url + native_release_checksums (HTTPS + mandatory SHA-256)
#   3. native_release_image (multi-arch scratch OCI image pulled via Docker + SHA256SUMS check)

- name: "native-daemons | Determine whether any native binary is requested"
  ansible.builtin.set_fact:
    _native_any_enabled: >-
      {{
        (native_daemons_enabled | default(false) | bool)
        or (native_guardd_enabled | default(false) | bool)
        or (native_guardd_ffi_enabled | default(false) | bool)
        or (native_healthd_enabled | default(false) | bool)
        or (native_metricsd_enabled | default(false) | bool)
        or (native_alertd_enabled | default(false) | bool)
        or (native_controld_enabled | default(false) | bool)
        or (native_certd_enabled | default(false) | bool)
        or (native_backupd_enabled | default(false) | bool)
        or (native_updated_enabled | default(false) | bool)
        or (native_authelia_bansd_enabled | default(false) | bool)
        or (native_authelia_usersd_enabled | default(false) | bool)
        or (native_authelia_configd_enabled | default(false) | bool)
        or (native_tools_enabled | default(false) | bool)
      }}

- name: "native-daemons | Install and verify native binaries"
  when: _native_any_enabled | bool
  block:
    - name: "native-daemons | Map host architecture to release arch"
      ansible.builtin.set_fact:
        _native_arch: >-
          {{
            {
              'x86_64': 'amd64',
              'aarch64': 'arm64',
              'arm64': 'arm64'
            }[ansible_architecture] | default('')
          }}

    - name: "native-daemons | Require supported architecture (amd64 or arm64)"
      ansible.builtin.assert:
        that:
          - _native_arch in ['amd64', 'arm64']
        fail_msg: >-
          Unsupported host architecture '{{ ansible_architecture }}' for native
          easy-ha-proxy binaries (supported: x86_64, aarch64).

    - name: "native-daemons | Select delivery mode"
      ansible.builtin.set_fact:
        _native_mode: >-
          {%- if native_local_bundle_dir | default('') | length > 0 -%}local
          {%- elif native_release_base_url | default('') | length > 0 -%}https
          {%- elif native_release_image | default('') | length > 0 -%}oci
          {%- else -%}none
          {%- endif -%}

    - name: "native-daemons | Validate configured delivery source"
      ansible.builtin.assert:
        that:
          - _native_mode in ['local', 'https', 'oci']
          - _native_mode != 'https' or (
              (native_release_base_url | default('') | regex_search('^https://')) is not none
              and (native_release_checksums[_native_arch] | default('') | regex_search('^[0-9a-fA-F]{64}$')) is not none
            )
        fail_msg: >-
          Configure native_release_image, native_local_bundle_dir, or both an
          https:// native_release_base_url and a 64-hex SHA-256 entry in
          native_release_checksums['{{ _native_arch }}'].

    - name: "native-daemons | Ensure staging and native library directories exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /usr/local/lib/easy-ha-proxy
        - /var/lib/easy-ha-proxy/native-staging

    - name: "native-daemons | Copy local release bundle when configured"
      ansible.builtin.copy:
        src: "{{ native_local_bundle_dir }}/easy-ha-proxy-native-linux-{{ _native_arch }}.tar.gz"
        dest: "/var/lib/easy-ha-proxy/native-staging/easy-ha-proxy-native-linux-{{ _native_arch }}.tar.gz"
        owner: root
        group: root
        mode: "0600"
      when: _native_mode == 'local'

    - name: "native-daemons | Download and SHA-256 verify release bundle over HTTPS"
      ansible.builtin.get_url:
        url: "{{ native_release_base_url | regex_replace('/+$', '') }}/easy-ha-proxy-native-linux-{{ _native_arch }}.tar.gz"
        dest: "/var/lib/easy-ha-proxy/native-staging/easy-ha-proxy-native-linux-{{ _native_arch }}.tar.gz"
        checksum: "sha256:{{ native_release_checksums[_native_arch] }}"
        owner: root
        group: root
        mode: "0600"
        timeout: 60
      when:
        - _native_mode == 'https'
        - not (easy_ha_proxy_offline_restore | default(false) | bool)

    - name: "native-daemons | Verify the cached HTTPS bundle for offline restore"
      when:
        - _native_mode == 'https'
        - easy_ha_proxy_offline_restore | default(false) | bool
      block:
        - name: Check the locally prepared bundle
          ansible.builtin.stat:
            path: "/var/lib/easy-ha-proxy/native-staging/easy-ha-proxy-native-linux-{{ _native_arch }}.tar.gz"
            checksum_algorithm: sha256
            follow: false
          register: _native_cached_bundle

        - name: Require the configured release checksum
          ansible.builtin.assert:
            that:
              - _native_cached_bundle.stat.isreg | default(false)
              - _native_cached_bundle.stat.checksum | default('') == native_release_checksums[_native_arch] | lower
            fail_msg: "Prepare the verified native release bundle on this host before offline restore."

    - name: "native-daemons | Unpack tarball bundle into staging directory"
      ansible.builtin.unarchive:
        src: "/var/lib/easy-ha-proxy/native-staging/easy-ha-proxy-native-linux-{{ _native_arch }}.tar.gz"
        dest: /var/lib/easy-ha-proxy/native-staging
        remote_src: true
      when: _native_mode in ['local', 'https']

    # The binaries must be the ones CI built from the revision being installed.
    # The floating channel tag moves with every push, and SHA256SUMS inside the
    # image only proves the image is intact, not which commit it came from.
    - name: "native-daemons | Read the source revision being installed"
      ansible.builtin.command:
        # safe.directory: a checkout owned by another user must not read as "no revision".
        argv: [git, -c, "safe.directory={{ playbook_dir | dirname }}", -C, "{{ playbook_dir | dirname }}", rev-parse, HEAD]
      register: _native_source_revision
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - _native_mode == 'oci'
        - native_release_pin_revision | default(true) | bool

    # Pinned: the image CI tags with that commit (<channel tag>-<12 hex>), whose
    # revision label must name the same commit, copied out by its digest so a
    # concurrent push cannot swap it in between. The digest and revision are
    # kept beside the staging files. Without a git checkout, or with
    # native_release_pin_revision false, the channel tag is used as before.
    - name: "native-daemons | Pull and verify native binary bundle from OCI image"
      ansible.builtin.shell: |
        set -euo pipefail
        img={{ native_release_image | quote }}
        rev={{ ((_native_source_revision.stdout | default('') | trim)
                if (_native_source_revision.rc | default(1)) == 0 else '') | quote }}
        stage="/var/lib/easy-ha-proxy/native-staging"
        if [ -n "${rev}" ]; then
          img="${img}-${rev:0:12}"
        fi
        {% if not (easy_ha_proxy_offline_restore | default(false) | bool) %}
        if ! docker pull "${img}"; then
          echo "The native binaries are not published or could not be pulled (${img})." >&2
          exit 1
        fi
        {% endif %}
        # Resolve the tag once. Check the label on the same immutable
        # image that will supply the files, even if the tag moves.
        ref="$(docker image inspect --format '{% raw %}{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}{% endraw %}' "${img}")"
        if [ -n "${rev}" ]; then
          built="$(docker image inspect --format '{% raw %}{{ index .Config.Labels "org.opencontainers.image.revision" }}{% endraw %}' "${ref}")"
          if [ "${built}" != "${rev}" ]; then
            echo "${img} was built from ${built:-an unknown revision}, not ${rev}." >&2
            exit 1
          fi
        fi
        cid="$(docker create --pull=never "${ref}")"
        trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
        rm -rf "${stage}/sbin" "${stage}/lib" "${stage}/SHA256SUMS"
        docker cp "${cid}:/sbin" "${stage}/sbin"
        docker cp "${cid}:/lib" "${stage}/lib"
        docker cp "${cid}:/SHA256SUMS" "${stage}/SHA256SUMS"
        (cd "${stage}" && sha256sum -c SHA256SUMS)
        printf '{"image": "%s", "digest": "%s", "revision": "%s"}\n' "${img}" "${ref}" "${rev}" > "${stage}/image.json"
      args:
        executable: /bin/bash
      when: _native_mode == 'oci'
      changed_when: true

    - name: "native-daemons | Smoke-check easy-ha-proxy-agent binary"
      ansible.builtin.command:
        argv:
          - /var/lib/easy-ha-proxy/native-staging/sbin/easy-ha-proxy-agent
          - version
      changed_when: false

    - name: "native-daemons | Smoke-check guardd-core binary"
      ansible.builtin.command:
        argv:
          - /var/lib/easy-ha-proxy/native-staging/sbin/guardd-core
          - --help
      register: _guardd_core_smoke
      changed_when: false
      failed_when: >-
        _guardd_core_smoke.rc != 0
        and ('usage: guardd-core' not in ((_guardd_core_smoke.stdout | default('')) ~ (_guardd_core_smoke.stderr | default(''))))

    - name: "native-daemons | Install the verified files with rollback on copy failure"
      vars:
        _native_files:
          - source: sbin/easy-ha-proxy-agent
            dest: "{{ native_agent_bin | default('/usr/local/sbin/easy-ha-proxy-agent') }}"
            mode: "0755"
          - source: sbin/guardd-core
            dest: "{{ native_guardd_bin | default('/usr/local/sbin/guardd-core') }}"
            mode: "0755"
          - source: lib/libguardd_core.so
            dest: "{{ native_guardd_lib | default('/usr/local/lib/easy-ha-proxy/libguardd_core.so') }}"
            mode: "0644"
      block:
        - name: Record existing native files
          ansible.builtin.stat:
            path: "{{ item.dest }}"
            follow: false
          loop: "{{ _native_files }}"
          register: _native_original

        - name: Require regular files at existing installation paths
          ansible.builtin.assert:
            that:
              - not item.stat.exists or (item.stat.isreg | default(false))
          loop: "{{ _native_original.results }}"
          loop_control:
            label: "{{ item.item.dest }}"

        - name: Replace the verified native files
          ansible.builtin.copy:
            src: "/var/lib/easy-ha-proxy/native-staging/{{ item.source }}"
            dest: "{{ item.dest }}"
            remote_src: true
            owner: root
            group: root
            mode: "{{ item.mode }}"
            backup: true
          loop: "{{ _native_files }}"
          register: _native_install

        - name: Remember which daemon binaries were replaced
          ansible.builtin.set_fact:
            _native_agent_copy: "{{ _native_install.results[0] }}"
            _native_guardd_copy: "{{ _native_install.results[1] }}"
      rescue:
        - name: Restore the previous files saved by Ansible
          ansible.builtin.copy:
            src: "{{ item.backup_file }}"
            dest: "{{ item.item.dest }}"
            remote_src: true
            mode: preserve
          loop: "{{ _native_install.results | default([]) }}"
          when: item.backup_file is defined
          loop_control:
            label: "{{ item.item.dest }}"

        - name: Restore the original file attributes
          ansible.builtin.file:
            path: "{{ item.item.dest }}"
            owner: "{{ item.stat.uid }}"
            group: "{{ item.stat.gid }}"
            mode: "{{ item.stat.mode }}"
            state: file
            follow: false
          loop: "{{ _native_original.results | default([]) }}"
          when:
            - _native_install.results is defined
            - item.stat.isreg | default(false)
          loop_control:
            label: "{{ item.item.dest }}"

        - name: Remove newly installed files when no original existed
          ansible.builtin.file:
            path: "{{ item.item.dest }}"
            state: absent
          loop: "{{ _native_original.results | default([]) }}"
          when:
            - _native_install.results is defined
            - not item.stat.exists
          loop_control:
            label: "{{ item.item.dest }}"

        - name: Report the failed native installation
          ansible.builtin.fail:
            msg: "Could not install the verified native bundle. Service restarts were skipped."

    - name: "native-daemons | Remove temporary copies of replaced native files"
      ansible.builtin.file:
        path: "{{ item.backup_file }}"
        state: absent
      loop: "{{ _native_install.results }}"
      when: item.backup_file is defined
      loop_control:
        label: "{{ item.item.dest }}"

    # A replaced binary is not picked up by a running service: until a
    # restart it keeps executing the old file. try-restart touches only units
    # that are running, so a fresh install (units not there yet) is a no-op.
    # The update broker is handled below: it may supervise the update job
    # running this playbook.
    - name: "native-daemons | Restart running daemons that use the replaced agent binary"
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'try-restart'] + _native_agent_units }}"
      vars:
        _native_agent_units: >-
          {{ [
               ('haproxy-healthd.service' if native_healthd_enabled | default(false) | bool else ''),
               ('easy-ha-proxy-metricsd.service' if native_metricsd_enabled | default(false) | bool else ''),
               ('easy-ha-proxy-alertd.service' if native_alertd_enabled | default(false) | bool else ''),
               ('haproxy-controld.service' if native_controld_enabled | default(false) | bool else ''),
               ('haproxy-certd.service' if native_certd_enabled | default(false) | bool else ''),
               ('authelia-bansd.service' if native_authelia_bansd_enabled | default(false) | bool else ''),
               ('authelia-usersd.service' if native_authelia_usersd_enabled | default(false) | bool else ''),
               ('authelia-configd.service' if native_authelia_configd_enabled | default(false) | bool else '')
             ] | select | list }}
      when:
        - _native_agent_copy is changed
        - _native_agent_units | length > 0
      changed_when: true

    - name: "native-daemons | Pick up the new backup broker outside active restores"
      when:
        - _native_agent_copy is changed
        - native_backupd_enabled | default(false) | bool
      block:
        - name: Inspect the active restore marker
          ansible.builtin.stat:
            path: "{{ backupd_restore_active_marker }}"
            follow: false
          register: _native_restore_active

        - name: Ask the backup broker to restart after restore cleanup
          ansible.builtin.file:
            path: "{{ backupd_restart_request_marker }}"
            state: touch
            owner: root
            group: "{{ app_group }}"
            mode: "0600"
          when: _native_restore_active.stat.exists

        - name: Restart the running backup broker outside a restore
          ansible.builtin.command:
            argv: [systemctl, try-restart, --no-block, easy-ha-proxy-backupd.service]
          when: not _native_restore_active.stat.exists
          changed_when: true

    # The update broker runs from the same binary but supervises the job that
    # may be running this playbook. A changes-only update of go/ runs this
    # stage alone, not updated.yml, so the broker's restart is arranged here:
    # during an update it is asked to restart once its job ends (the marker it
    # watches); outside one it is restarted now. Left out, the old broker kept
    # serving from the replaced file.
    - name: "native-daemons | Inspect the active update marker"
      ansible.builtin.stat:
        path: "{{ updated_active_marker | default('/run/easy-ha-proxy/easy-ha-proxy-update.active') }}"
        follow: false
      register: _native_update_active
      when:
        - _native_agent_copy is changed
        - native_updated_enabled | default(false) | bool

    - name: "native-daemons | Ask the update broker to restart once its job ends"
      ansible.builtin.file:
        path: "{{ updated_restart_request_marker | default('/run/easy-ha-proxy/easy-ha-proxy-updated-restart.requested') }}"
        state: touch
        owner: root
        group: "{{ app_group | default('hadmin') }}"
        mode: "0600"
      when:
        - _native_agent_copy is changed
        - native_updated_enabled | default(false) | bool
        - _native_update_active.stat.exists

    - name: "native-daemons | Restart the update broker on the replaced binary"
      ansible.builtin.command:
        argv: [systemctl, try-restart, easy-ha-proxy-updated.service]
      when:
        - _native_agent_copy is changed
        - native_updated_enabled | default(false) | bool
        - not _native_update_active.stat.exists
      changed_when: true

    - name: "native-daemons | Restart guardd when its Rust binary was replaced"
      ansible.builtin.command:
        argv: [systemctl, try-restart, easy-ha-proxy-guardd.service]
      when:
        - _native_guardd_copy is changed
        - native_guardd_enabled | default(false) | bool
      changed_when: true
