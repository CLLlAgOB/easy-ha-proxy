# -------------------------------------------------------------------
# 1) Packages
# -------------------------------------------------------------------
- import_tasks: packages.yml
  tags: restore-network

- import_tasks: fs.yml

# -------------------------------------------------------------------
# 4) The helper daemons (moved into stages of their own)
# -------------------------------------------------------------------
# These run with the Go installer in one call when the agent has them
# (go_part.yml); each one it does not run is included from its task file
# (dynamic, so a part the agent ran costs one skipped task; see go_fallback.yml).
- import_tasks: go_part.yml
  vars:
    go_parts: [certd, controld, backupd, iptables-ban, iptables-udp]
- include_tasks: {file: certd.yml, apply: {tags: [always]}}
  when: "'certd' not in (go_agent_part_names | default([]))"
- include_tasks: {file: controld.yml, apply: {tags: [always]}}
  when: "'controld' not in (go_agent_part_names | default([]))"
- include_tasks: {file: backupd.yml, apply: {tags: [always]}}
  when: "'backupd' not in (go_agent_part_names | default([]))"
- include_tasks: {file: iptables-ban.yml, apply: {tags: [always]}}
  when: "'iptables-ban' not in (go_agent_part_names | default([]))"
- include_tasks: {file: iptables-udp.yml, apply: {tags: [always]}}
  when: "'iptables-udp' not in (go_agent_part_names | default([]))"
