---
# roles/authelia/tasks/go_fallback.yml
#
# An authelia role entry whose task file the Go installer may run (main.yml
# sends it here): the agent runs it, or else the task file is included (see
# roles/haproxy-admin/tasks/go_fallback.yml for the include and its tags).
# Nothing the role does notifies a handler, and nothing outside it reads what
# it registers.

- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: ["authelia/{{ task_stage }}"]

- ansible.builtin.include_tasks:
    file: "{{ task_stage }}.yml"
    apply:
      tags: [always]
  when: ('authelia/' ~ task_stage) not in (go_agent_part_names | default([]))
