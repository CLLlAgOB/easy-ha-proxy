---
- name: "Authelia | fs | prepare directories, files and permissions"
  when: authelia_enabled | default(false) | bool
  block:
    - name: Ensure private runtime directory exists
      become: true
      ansible.builtin.file:
        path: /run/easy-ha-proxy
        state: directory
        owner: root
        group: "{{ authelia_log_reader_group }}"
        mode: "0750"

    # -------- SERVICE USERS FOR THE CONTAINERS --------
    - name: Ensure groups for Authelia stack exist
      become: true
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        system: true
      loop:
        - { name: "authelia",       gid: "{{ authelia_gid }}" }
        - { name: "authelia_redis", gid: "{{ authelia_redis_gid }}" }

    - name: Ensure users for Authelia stack exist
      become: true
      ansible.builtin.user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        group: "{{ item.group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
      loop:
        - { name: "authelia",       uid: "{{ authelia_uid }}",       group: "authelia" }
        - { name: "authelia_redis", uid: "{{ authelia_redis_uid }}", group: "authelia_redis" }

    # -------- DIRECTORIES / PERMISSIONS ON THE HOST --------
    - name: Ensure Authelia base dir exists and has correct permissions
      become: true
      ansible.builtin.file:
        path: "{{ authelia_root_dir }}"
        state: directory
        owner: authelia
        group: authelia
        mode: "0750"

    - name: Ensure the local Authelia notification file is private
      become: true
      ansible.builtin.file:
        path: "{{ authelia_root_dir }}/notification.log"
        state: touch
        owner: authelia
        group: authelia
        mode: "0600"
        access_time: preserve
        modification_time: preserve

    - name: Ensure Authelia redis data dir exists
      when: authelia_session_redis_enabled | default(true)
      become: true
      ansible.builtin.file:
        path: "{{ authelia_redis_data_dir }}"
        state: directory
        owner: authelia_redis
        group: authelia_redis
        mode: "0750"

    # THE AUTHELIA LOG DIRECTORY (authelia writes, haproxy reads)
    - name: Ensure Authelia logs dir exists
      become: true
      ansible.builtin.file:
        path: "{{ authelia_logs_dir }}"
        state: directory
        owner: authelia
        group: "{{ authelia_log_reader_group }}"
        mode: "0750"

    - name: Stat Authelia log file
      ansible.builtin.stat:
        path: "{{ authelia_log_file }}"
      register: authelia_log_stat

    - name: Ensure directory for Authelia log exists
      become: true
      ansible.builtin.file:
        path: "{{ authelia_log_file | dirname }}"
        state: directory
        owner: authelia
        group: "{{ authelia_log_reader_group }}"
        mode: "0750"
      when: not authelia_log_stat.stat.exists

    - name: Create Authelia log file if it does not exist
      become: true
      ansible.builtin.file:
        path: "{{ authelia_log_file }}"
        state: touch
        owner: authelia
        group: "{{ authelia_log_reader_group }}"
        mode: "0640"
      when: not authelia_log_stat.stat.exists

    - name: Ensure permissions on the existing Authelia log file
      become: true
      ansible.builtin.file:
        path: "{{ authelia_log_file }}"
        state: file
        owner: authelia
        group: "{{ authelia_log_reader_group }}"
        mode: "0640"
      when: authelia_log_stat.stat.exists

    # ACLs (so haproxy/haproxyadmin can read the logs)
    - name: Ensure ACL support is installed
      become: true
      ansible.builtin.apt:
        name: acl
        state: present
        update_cache: yes
      tags: restore-network

    - name: Allow haproxy reader user to read Authelia log (current file)
      become: true
      ansible.posix.acl:
        path: "{{ authelia_log_file }}"
        entity: "{{ authelia_log_reader_user }}"
        etype: user
        permissions: r
        state: present

    - name: Ensure default ACL for Authelia logs dir
      become: true
      ansible.posix.acl:
        path: "{{ authelia_logs_dir }}"
        entity: "{{ authelia_log_reader_user }}"
        etype: user
        permissions: rx
        default: yes
        state: present

    - name: Remove inherited default ACL for log reader on Authelia root dir
      become: true
      ansible.posix.acl:
        path: "{{ authelia_root_dir }}"
        entity: "{{ authelia_log_reader_user }}"
        etype: user
        default: yes
        state: absent

    - name: Remove inherited default ACL for log reader on Authelia redis dir
      when: authelia_session_redis_enabled | default(true)
      become: true
      ansible.posix.acl:
        path: "{{ authelia_redis_data_dir }}"
        entity: "{{ authelia_log_reader_user }}"
        etype: user
        default: yes
        state: absent

    - name: Check existing private Authelia paths for stale log-reader ACL cleanup
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ authelia_config_file }}"
        - "{{ authelia_env_file }}"
        - "{{ authelia_docker_compose_file }}"
        - "{{ authelia_root_dir }}/notification.log"
        - "{{ authelia_root_dir }}/{{ authelia_storage_local_path | default('/config/db.sqlite3') | basename }}"
        - "{{ authelia_root_dir }}/{{ authelia_storage_local_path | default('/config/db.sqlite3') | basename }}-wal"
        - "{{ authelia_root_dir }}/{{ authelia_storage_local_path | default('/config/db.sqlite3') | basename }}-shm"
        - "{{ authelia_root_dir }}/{{ authelia_storage_local_path | default('/config/db.sqlite3') | basename }}-journal"
        - "{{ authelia_redis_data_dir }}"
      register: authelia_private_acl_paths

    - name: Remove inherited log-reader ACL from private Authelia files and dirs
      become: true
      ansible.posix.acl:
        path: "{{ item.item }}"
        entity: "{{ authelia_log_reader_user }}"
        etype: user
        state: absent
      loop: "{{ authelia_private_acl_paths.results }}"
      when: item.stat.exists and not item.stat.islnk

    - name: Allow haproxy reader user to traverse Authelia root dir (non-default ACL)
      become: true
      ansible.posix.acl:
        path: "{{ authelia_root_dir }}"
        entity: "{{ authelia_log_reader_user }}"
        etype: user
        permissions: x
        state: present

    - name: Allow haproxy reader user to traverse Authelia logs dir (non-default ACL)
      become: true
      ansible.posix.acl:
        path: "{{ authelia_logs_dir }}"
        entity: "{{ authelia_log_reader_user }}"
        etype: user
        permissions: rx
        state: present

    # The e-mail templates directory (the templates themselves stay in config/install)
    - name: Ensure Authelia email templates dir exists
      become: true
      ansible.builtin.file:
        path: /opt/authelia/email_templates
        state: directory
        owner: authelia
        group: authelia
        mode: "0750"

    # LUA directories for haproxy (the Authelia role puts files there)
    - name: Ensure HAProxy lua dir exists
      become: true
      ansible.builtin.file:
        path: /etc/haproxy/lua
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure haproxy-lua-http dir exists
      become: true
      ansible.builtin.file:
        path: /etc/haproxy/lua/haproxy-lua-http
        state: directory
        owner: root
        group: root
        mode: "0755"
