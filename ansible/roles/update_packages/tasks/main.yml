---
# roles/update_packages/tasks/main.yml
#
# The Go installer runs upgrade.yml (with Docker's live_restore.yml and
# HAProxy's protection.yml) when the installed agent has it; otherwise it is
# included from here (see roles/haproxy-admin/tasks/go_part.yml).
- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: [update_packages/upgrade]

- ansible.builtin.include_tasks:
    file: upgrade.yml
    apply:
      tags: [always]
  when: "'update_packages/upgrade' not in (go_agent_part_names | default([]))"
