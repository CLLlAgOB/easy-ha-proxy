---
- name: Configure APT retries and timeouts
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80-retries
    owner: root
    group: root
    mode: '0644'
    content: |
      Acquire::Retries "5";
      Acquire::http::Timeout "30";
      Acquire::https::Timeout "30";
      Acquire::http::No-Cache "true";

- name: Check whether needrestart is installed
  ansible.builtin.stat:
    path: /usr/sbin/needrestart
  register: update_packages_needrestart

- name: Ensure the needrestart drop-in directory exists
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: update_packages_needrestart.stat.exists

# The update broker starts this role in a separate transient systemd unit.
# Restarting the broker from needrestart makes apt wait for the broker while
# the broker waits for apt, so the update cannot finish; restarting the job
# unit itself would stop apt half way.  The backup broker
# uses the same long-running job model.  Neither service is supplied by an APT
# package; their Ansible roles perform the required restarts after code changes.
- name: Keep needrestart from stopping active maintenance brokers
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/easy-ha-proxy.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by easy-ha-proxy.
      $nrconf{override_rc}{qr(^easy-ha-proxy-updated\.service$)} = 0;
      $nrconf{override_rc}{qr(^easy-ha-proxy-updated-job-[0-9a-f]{12}\.service$)} = 0;
      $nrconf{override_rc}{qr(^easy-ha-proxy-backupd\.service$)} = 0;
  when: update_packages_needrestart.stat.exists

- name: Keep Docker containers running before system packages can restart Docker
  ansible.builtin.import_role:
    name: docker
    tasks_from: live_restore

- name: Protect installed HAProxy before upgrading other packages
  ansible.builtin.import_role:
    name: haproxy
    tasks_from: protection

- name: Refresh APT metadata before reviewing the package upgrade
  become: true
  apt:
    update_cache: yes
    cache_valid_time: 0

- name: Verify package upgrade safety and record the installation attempt
  ansible.builtin.script:
    cmd: >-
      {{ (playbook_dir ~ '/../installer/os_upgrade_guard.py') | quote }}
      {{ '--automatic' if easy_ha_proxy_automatic_os_upgrade | default(false) | bool else '' }}
      --state-root {{ ((updated_state_root | default('/var/lib/easy-ha-proxy/update-web')) ~ '/os-security') | quote }}
      {{ ('--runtime-maintenance ' ~ (easy_ha_proxy_runtime_maintenance_revision | quote) ~ ' --maintenance-until ' ~ (easy_ha_proxy_runtime_maintenance_until | string | quote))
         if easy_ha_proxy_runtime_maintenance_revision | default('') | length > 0 else
         ('--maintenance-revision ' ~ (easy_ha_proxy_maintenance_revision | quote) ~ ' --maintenance-until ' ~ (easy_ha_proxy_runtime_maintenance_until | string | quote))
         if easy_ha_proxy_maintenance_revision | default('') | length > 0 else '' }}
    executable: /usr/bin/python3
  when: not ansible_check_mode

- name: Update and upgrade apt packages
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  apt:
    # Reuse precisely the metadata the guard just reviewed.
    update_cache: no
    upgrade: yes
    force_apt_get: yes
  when:
    - easy_ha_proxy_maintenance_revision | default('') | length == 0
    - easy_ha_proxy_runtime_maintenance_revision | default('') | length == 0

# A systemd/timesyncd package upgrade can leave systemd-timesyncd stopped
# (observed on Ubuntu 24.04). Authelia refuses to start without a synchronized
# clock, so re-assert the time service right after upgrading packages.
- name: Read the systemd-timesyncd unit load state
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - systemd-timesyncd.service
      - --property=LoadState
      - --value
  register: update_packages_timesyncd_unit
  changed_when: false
  failed_when: false

- name: Ensure systemd-timesyncd stays enabled and running after the upgrade
  ansible.builtin.systemd:
    name: systemd-timesyncd.service
    enabled: true
    state: started
  become: true
  when: update_packages_timesyncd_unit.stdout | default('') | trim == 'loaded'

- name: Check whether a reboot is required
  stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Report the required reboot
  debug:
    msg: >-
      The system requires a reboot. The easy-ha-proxy assistant will ask
      whether to schedule it after Ansible exits. When running this playbook
      directly, reboot the server manually or explicitly enable the remote
      reboot option.
  when: reboot_required.stat.exists

- name: Reboot an SSH-managed target when explicitly requested
  ansible.builtin.reboot:
    connect_timeout: 120
  become: true
  when:
    - reboot_required.stat.exists
    - easy_ha_proxy_reboot_after_upgrade | default(false) | bool
    - (ansible_connection | default('smart')) != 'local'

- name: Explain why a local Ansible connection is not rebooted
  ansible.builtin.debug:
    msg: >-
      Automatic reboot was deferred because Ansible is running with a local
      connection. Use the easy-ha-proxy assistant prompt or reboot manually.
  when:
    - reboot_required.stat.exists
    - easy_ha_proxy_reboot_after_upgrade | default(false) | bool
    - (ansible_connection | default('smart')) == 'local'
