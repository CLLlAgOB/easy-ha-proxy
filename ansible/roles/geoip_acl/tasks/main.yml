---
# The GeoIP tasks (geoip.yml) run with the Go installer when the agent has
# them, else they are included (see roles/haproxy-admin/tasks/go_fallback.yml
# for the include and its tags).
- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: [geoip_acl/geoip]

- ansible.builtin.include_tasks:
    file: geoip.yml
    apply:
      tags: [always]
  when: "'geoip_acl/geoip' not in (go_agent_part_names | default([]))"
