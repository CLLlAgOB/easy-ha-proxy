---
# Keep the local country database available for the administration UI even
# when HAProxy country filtering is disabled.
geoip_database_enabled: true
geoip_database_base_url: "https://download.db-ip.com/free"

# ISO 3166-1 alpha-2 countries used to derive the HAProxy ACL from the MMDB.
geoip_country_codes:
  - RU
  - PL
  - US

# allow: permit selected countries; deny: reject selected countries.
geoip_mode: "allow"
enable_geoip: false

# DB-IP Country Lite is published monthly, so a weekly check is plenty: it
# picks up a new monthly release within days and retries a delayed publication
# without daily churn. The updater makes no network request once the current
# month's DB is active. Override to "daily"/"monthly" if desired; a manual
# update is always available from the web UI.
geoip_update_on_calendar: "weekly"
geoip_update_randomized_delay: "2h"

# The updater: the native agent's update-geoip (installed by the
# haproxy-admin native stage, which runs before this role).
native_agent_bin: /usr/local/sbin/easy-ha-proxy-agent
