---
# roles/cert/tasks/go_fallback.yml
#
# A cert role entry whose task file the Go installer may run (main.yml sends
# it here): the agent runs it, or else the task file is included (see
# roles/haproxy-admin/tasks/go_fallback.yml for the include and its tags).
# renew notifies build_pems_and_reload and flushes the handlers at once
# (renew__30_assemble.yml); the agent reports the notification, and it is
# notified and flushed here. haproxy_present, which the handler reads, comes
# back as a fact.

- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: ["cert/{{ task_stage }}"]

- name: "cert/{{ task_stage }} | Hand the notified handler to Ansible: build_pems_and_reload"
  ansible.builtin.debug:
    msg: Certificates were issued or are due a check; the PEMs are assembled and HAProxy reloaded now.
  changed_when: true
  notify: build_pems_and_reload
  when: >-
    'build_pems_and_reload' in ((go_part_result.stdout_lines | default(['{}']) | last | from_json).notified | default([]))

- name: "cert/{{ task_stage }} | Run the handler now, as renew__30_assemble.yml does"
  ansible.builtin.include_tasks: go_flush.yml
  when: >-
    'build_pems_and_reload' in ((go_part_result.stdout_lines | default(['{}']) | last | from_json).notified | default([]))

- ansible.builtin.include_tasks:
    file: "{{ task_stage }}.yml"
    apply:
      tags: [always]
  when: ('cert/' ~ task_stage) not in (go_agent_part_names | default([]))
