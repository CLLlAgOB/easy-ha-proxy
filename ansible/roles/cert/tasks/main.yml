# The task files the Go installer may run go through go_fallback.yml (the
# agent runs them, or else the task file is included); every other one is
# imported as it is. A test keeps the list equal to the cert parts.
- import_tasks: >-
    {{ 'go_fallback.yml' if task_stage in ['install', 'notify', 'hooks', 'renew', 'test', 'rdg', 'remove_orphans'] else task_stage ~ '.yml' }}
