# roles/cert/tasks/remove_orphans.yml
# DRY-RUN: ansible-playbook site.yml -t remove_site -e cleanup_dry_run=true
# DELETE : ansible-playbook site.yml -t remove_site
# Requires: certbot_domains collected in pre_tasks. Optional: haproxy_certs_dir.

- name: "Validate that certbot_domains is defined"
  tags: [never, remove_site]
  assert:
    that:
      - certbot_domains is defined
      - certbot_domains | length >= 1
    fail_msg: "certbot_domains is undefined or empty. Collect it in pre_tasks."

- name: "Normalize the target domain list from pre_tasks"
  tags: [never, remove_site]
  set_fact:
    _target_domains: "{{ certbot_domains | unique | list }}"
    _certs_dir: "{{ haproxy_certs_dir | default('/etc/haproxy/certs') }}"

# 1) certbot's current lineages
- name: "Find current Certbot lineages (/etc/letsencrypt/renewal/*.conf)"
  tags: [never, remove_site]
  find:
    paths: /etc/letsencrypt/renewal
    patterns: "*.conf"
    file_type: file
  register: renewal_confs
  failed_when: false

- name: "Build the current Certbot lineage name list"
  tags: [never, remove_site]
  set_fact:
    current_lineages: "{{ (renewal_confs.files | default([]))
                          | map(attribute='path')
                          | map('basename')
                          | map('regex_replace','\\.conf$','')
                          | list }}"

# 2) Orphaned lineages = those whose root (without -rsa/-ecdsa) is not in _target_domains
- name: "Calculate orphaned Certbot lineages by exact name"
  tags: [never, remove_site]
  set_fact:
    orphan_lineages: >-
      {{
        dict(
          current_lineages
          | zip(current_lineages | map('regex_replace','(-rsa|-ecdsa)$','') | list)
        )
        | dict2items
        | rejectattr('value','in', _target_domains)
        | map(attribute='key')
        | list
        | unique
        | sort
      }}

# 3) Find the *.pem files and decide which are "orphaned"
- name: "Find assembled HAProxy PEM files"
  tags: [never, remove_site]
  find:
    paths: "{{ _certs_dir }}"
    patterns: "*.pem"
    file_type: file
  register: haproxy_pems
  failed_when: false

# 3a) *.pem to delete -- by an EXACT match with orphan_lineages (if any)
- name: "Calculate PEM files matching orphaned lineages"
  tags: [never, remove_site]
  set_fact:
    orphan_pems_exact: >-
      {{
        (haproxy_pems.files | default([]))
        | map(attribute='path') | map('basename') | list
        | select('in', orphan_lineages | map('regex_replace', '$', '.pem') | list)
        | list
      }}

# 3b) *.pem to delete -- by the ROOT (the lineage is gone but the file stayed)
- name: "Calculate orphaned PEM files by root domain"
  tags: [never, remove_site]
  set_fact:
    orphan_pems_by_root: >-
      {{
        dict(
          ((haproxy_pems.files | default([])) | map(attribute='path') | map('basename') | list)
          |
          zip(
            (
              (haproxy_pems.files | default([]))
              | map(attribute='path') | map('basename') | list
              | map('regex_replace','pem$','')
              | map('regex_replace','\\.$','')
              | map('regex_replace','(-rsa|-ecdsa)$','')
              | list
            )
          )
        )
        | dict2items
        | rejectattr('value','in', _target_domains)
        | map(attribute='key')
        | list
      }}

# 3b-bis) Names held on a standby certificate
#
# Such a PEM looks orphaned exactly when it is needed most: its Let's Encrypt
# lineage may already be gone -- deleted, say, precisely because the domain
# moved to another certificate authority. Removing it would take the site
# down, at the very moment the operator thinks everything is under control.
- name: "Find names held on a standby certificate"
  tags: [never, remove_site]
  find:
    paths: "{{ haproxy_certs_available_dir | default('/etc/haproxy/certs-available') }}"
    patterns: ".pinned"
    hidden: true
    recurse: true
    file_type: file
  register: _pinned_files
  failed_when: false
  changed_when: false

- name: "Build the list of held PEM names"
  tags: [never, remove_site]
  set_fact:
    pinned_pems: >-
      {{
        (_pinned_files.files | default([]))
        | map(attribute='path')
        | map('dirname')
        | map('basename')
        | map('regex_replace', '$', '.pem')
        | list
      }}

# 3c) The final list of *.pem to delete (guarded against clashing with active lineages)
- name: "Build the final orphaned PEM removal list"
  tags: [never, remove_site]
  set_fact:
    orphan_pems: >-
      {{
        (orphan_pems_exact + orphan_pems_by_root)
        | unique
        | difference(current_lineages | map('regex_replace', '$', '.pem') | list)
        | difference(pinned_pems | default([]))
        | sort
      }}

# 4) The DRY-RUN report
- name: "DRY-RUN | Show lineages and PEM files that would be removed"
  tags: [never, remove_site]
  debug:
    msg:
      - "Target domains      : {{ _target_domains | sort }}"
      - "Lineages found      : {{ current_lineages | sort }}"
      - "Lineages to delete  : {{ orphan_lineages }}"
      - "*.pem   to delete   : {{ orphan_pems }}"
      - "held                : {{ pinned_pems | default([]) }}"
      - "cleanup_dry_run={{ cleanup_dry_run | default(false) | bool }}"

# 5) Delete ONLY when it is not a dry run
- name: "certbot delete orphaned lineages (non-interactive, quiet)"
  tags: [never, remove_site]
  command:
    cmd: "certbot delete --non-interactive --quiet --cert-name {{ item }}"
  loop: "{{ orphan_lineages }}"
  when: not (cleanup_dry_run | default(false) | bool)
  register: _certbot_del
  # A lineage certbot keeps is cleaned up on the next removal, so it does not
  # stop this one; it is named below instead of passing in silence.
  failed_when: false
  changed_when: _certbot_del.rc == 0

- name: "Report orphaned lineages certbot did not delete"
  tags: [never, remove_site]
  ansible.builtin.debug:
    msg: >-
      certbot did not delete {{ item.item }}:
      {{ (item.stderr | default('') or item.stdout | default('')) | trim }}
  loop: "{{ _certbot_del.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: "Delete orphaned assembled HAProxy PEM files"
  tags: [never, remove_site]
  file:
    path: "{{ _certs_dir }}/{{ item }}"
    state: absent
  loop: "{{ orphan_pems }}"
  when: not (cleanup_dry_run | default(false) | bool)

- name: "Reload HAProxy after orphan cleanup"
  tags: [never, remove_site]
  service:
    name: haproxy
    state: reloaded
  when:
    - orphan_lineages | length > 0
    - not (cleanup_dry_run | default(false) | bool)
