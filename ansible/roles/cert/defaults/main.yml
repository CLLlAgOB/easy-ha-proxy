---
# Who Let's Encrypt sends mail to about expiring or broken certificates
certbot_email: admin@example.com

# THE SITES (SAN): one site -> many names
# - domain: the main CN/lineage (the directory name under /etc/letsencrypt/live)
# - alt_names: SAN aliases (www and the like)
# - key_types: which keys to issue: [ecdsa] or [ecdsa, rsa]
# - cert_path: where fullchain+privkey are joined for HAProxy (with two keys, -ecdsa/-rsa are added)
sites:
  - domain: site.com
    alt_names: [www.site.com]
    key_types: [rsa]               # can be [ecdsa, rsa]
    cert_path: "/etc/haproxy/certs/site.com.pem"

# Global key defaults (used when a site has no key_types)
cert_key_type: ecdsa                 # rsa | ecdsa (ecdsa by default)
rsa_key_size: 3072
ecdsa_curve: secp256r1               # p-256 (the best compatibility)

# RDG settings (used in the post-hook)
rdg_domain:   "example.com"          # the certificate's CN/SAN
rdg_host:     "example.com"          # the Windows server's FQDN or IP
rdg_ssh_user: "certbot"              # the account for the SFTP chroot
rdg_ssh_key:  "/root/.ssh/id_cert"   # the private key on the HAProxy host
rdg_ssh_port: 22                     # SSH port
rdg_pfx_password: ""                 # an empty password is allowed
rdg_remote_path: "C:/SFTP/upload/rdg_cert.pfx"

# Bootstrap mode: a temporary DNAT 80->8000 for Certbot's standalone server
haproxy_autoreload: true
haproxy_certs_dir: /etc/haproxy/certs
haproxy_certs_available_dir: /etc/haproxy/certs-available
acme_bootstrap: null   # null -> automatic; true/false -> forced
acme_ipv6: false
# === E-mail notifications about issued and renewed certificates ===
mail_notify_enabled: false

# Who to send them to
mail_notify_to: "admin@example.invalid"
mail_notify_from: "relay@example.invalid"

# External SMTP settings used by the managed mail_relay container.
mail_smtp_host: "smtp.example.invalid"
mail_smtp_port: 587           # 465 = SMTPS (SSL), 587 = STARTTLS
mail_smtp_user: ""
mail_smtp_pass: ""
mail_smtp_auth: "on"          # on/off
mail_smtp_ssl_mode: "starttls" # smtps | starttls
mail_smtp_tls_trust_file: "/etc/ssl/certs/ca-certificates.crt"

# (optional) limit the notifications to certain domains
mail_notify_only_for: []      # for example: ["rdg.domain.local", "ha.domain.local"]

# Issue mode: all -- every target; new -- only the missing lineages (for addsite)
cert_issue_mode: all

# (optional) limit the run to these domains (base names, without -rsa/-ecdsa)
sites_include: []

# (optional) public resolvers used to check that the DNS is ready
acme_resolvers:
  - 1.1.1.1
  - 8.8.8.8
