---
# roles/healthcheck/tasks/main.yml
#
# The Go installer runs status.yml when the installed agent has it; otherwise
# it is included from here (see roles/haproxy-admin/tasks/go_part.yml). This
# play has no haproxy-admin role, so the variables Ansible forwards to the
# agent are named here.
- ansible.builtin.import_tasks: ../../haproxy-admin/tasks/go_part.yml
  vars:
    go_parts: [healthcheck/status]
    go_installer_forwarded_vars:
      - status_check_fail_on_error
      - easy_ha_proxy_offline_restore

- ansible.builtin.include_tasks:
    file: status.yml
    apply:
      tags: [always]
  when: "'healthcheck/status' not in (go_agent_part_names | default([]))"
