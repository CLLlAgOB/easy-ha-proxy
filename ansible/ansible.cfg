[defaults]
stdout_callback = default
# Each task's duration and a slowest-tasks summary at the end of every run,
# so an update log shows where its time went.
callbacks_enabled = ansible.posix.profile_tasks, easy_ha_proxy_progress
# easy_ha_proxy_progress prints a task counter for the web update page, and
# only when EASY_HA_PROXY_PROGRESS=1 is set (the update broker sets it).
callback_plugins = ./callback_plugins
callback_result_format = yaml
callback_format_pretty = true
