name: OS security updates

on:
  push:
    branches: [alpha, main]
    paths:
      - 'go/agent/internal/hostsec/**'
      - 'go/agent/internal/tools/apt_metadata.go'
      - '.github/workflows/os-security.yml'
  pull_request:
    paths:
      - 'go/agent/internal/hostsec/**'
      - 'go/agent/internal/tools/apt_metadata.go'
      - '.github/workflows/os-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Native security updates (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/agent/go.mod
      - name: Build disposable hostsec smoke test binary
        working-directory: go/agent
        run: go test -c -tags=hostsec_smoke -o /tmp/hostsec-smoke.test ./internal/hostsec
      - name: Prepare disposable native tools
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer
          sudo apt-get update
          sudo env NEEDRESTART_MODE=l apt-get install -y --no-install-recommends unattended-upgrades needrestart gnupg
      - name: Verify signed security origins, actual installation and timer restoration
        run: sudo env EHP_SECURITY_DISPOSABLE=1 EHP_SMOKE_SYSTEMD=1 /tmp/hostsec-smoke.test -test.v -test.run '^TestDisposableOSSecurityAndAutoReboot$'

  debian:
    name: Native APT (Debian ${{ matrix.release }})
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.release }}-slim
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare disposable native tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends unattended-upgrades needrestart gnupg ca-certificates
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/agent/go.mod
      - name: Verify native APT with the container timer adapter
        working-directory: go/agent
        run: EHP_SECURITY_DISPOSABLE=1 go test -tags=hostsec_smoke -v -run '^TestDisposableOSSecurityAndAutoReboot$' ./internal/hostsec
