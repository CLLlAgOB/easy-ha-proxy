name: Dependencies

# Weekly, and whenever a pinned version changes. Separate from CI on purpose:
# a vulnerability published today in a library pinned last month should be
# reported, but must not stop a fix from being tested and published.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [alpha]
    paths:
      - '**/requirements.txt'
      - 'ansible/roles/*/defaults/main.yml'
      - 'go/agent/internal/pinnedversions/**'
      - 'go/agent/cmd/pinned-versions/**'
      - '.github/workflows/dependencies.yml'

permissions:
  contents: read

jobs:
  pinned:
    name: Pinned versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/agent/go.mod
          cache: false
      - name: Compare with the registries
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: go/agent
        run: go run ./cmd/pinned-versions --github --root "$GITHUB_WORKSPACE"
