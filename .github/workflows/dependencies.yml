name: Dependencies

# Weekly, and whenever a pinned version changes. Separate from CI on purpose:
# a vulnerability published today in a library pinned last month should be
# reported, but must not stop a fix from being tested and published.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [alpha]
    paths:
      - '**/requirements.txt'
      - 'ansible/roles/*/defaults/main.yml'
      - '.github/scripts/pinned_versions.py'
      - '.github/workflows/dependencies.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: pip-audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit --progress-spinner off -r installer/requirements.txt

  pinned:
    name: Pinned versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compare with the registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pinned_versions.py --github
