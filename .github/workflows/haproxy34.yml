name: HAProxy 3.4 packages

on:
  push:
    branches: [alpha]
    paths:
      - 'go/**'
      - 'ansible/roles/haproxy/**'
      - 'ansible/roles/authelia/files/lua/**'
      - '.tests/integration/**'
      - '.github/workflows/haproxy34.yml'
  pull_request:
    paths:
      - 'go/**'
      - 'ansible/roles/haproxy/**'
      - 'ansible/roles/authelia/files/lua/**'
      - '.tests/integration/**'
      - '.github/workflows/haproxy34.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haproxy34-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-migration:
    name: Native migration and rollback (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/agent/go.mod
          cache: false
      - name: Build the installer agent and migration smoke test binary
        working-directory: go/agent
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/easy-ha-proxy-agent" ./cmd/easy-ha-proxy-agent
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/annotate-native-failure" ./cmd/annotate-native-failure
          go test -c -tags=haproxymigrate_smoke -o "$RUNNER_TEMP/haproxymigrate-smoke.test" ./internal/haproxymigrate
      - name: Install the distribution baseline
        run: |
          test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
          .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" haproxy/package distribution
      - name: Exercise actual systemd reload, failed candidate and rollback
        run: |
          set -o pipefail
          sudo env EHP_MIGRATION_DISPOSABLE=1 EHP_REPO_ROOT="$GITHUB_WORKSPACE" EHP_AGENT="$RUNNER_TEMP/easy-ha-proxy-agent" "$RUNNER_TEMP/haproxymigrate-smoke.test" -test.v -test.run '^TestDisposableHAProxyMigration$' 2>&1 | tee /tmp/native-migration-smoke.log
      - name: Annotate migration qualification failure
        if: failure()
        run: '"$RUNNER_TEMP/annotate-native-failure" /tmp/native-migration-smoke.log'
      - name: Qualify distribution prerequisites for the panel
        run: .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" packages distribution
      - name: Qualify distribution patches against a signed disposable repository
        run: sudo env EHP_MIGRATION_DISPOSABLE=1 EHP_REPO_ROOT="$GITHUB_WORKSPACE" EHP_AGENT="$RUNNER_TEMP/easy-ha-proxy-agent" "$RUNNER_TEMP/haproxymigrate-smoke.test" -test.v -test.run '^TestDisposableHAProxyPatch$'

  native-package:
    name: Native package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go/agent/go.mod
          cache: false
      - name: Build the installer agent and patch smoke test binary
        working-directory: go/agent
        run: |
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/easy-ha-proxy-agent" ./cmd/easy-ha-proxy-agent
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/haproxy-package-smoke" ./cmd/haproxy-package-smoke
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/server-state-smoke" ./cmd/server-state-smoke
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/annotate-native-failure" ./cmd/annotate-native-failure
          go test -c -tags=haproxymigrate_smoke -o "$RUNNER_TEMP/haproxymigrate-smoke.test" ./internal/haproxymigrate
      - name: Qualify the distribution baseline and refuse an implicit migration
        run: |
          .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" haproxy/package distribution
          sudo "$RUNNER_TEMP/haproxy-package-smoke" --expected-branch 2.8
          if .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" haproxy/package > /tmp/haproxy34-guard.log 2>&1; then
            echo 'An ordinary install must not replace the installed provider'
            exit 1
          fi
          grep -q 'Refusing to replace an installed HAProxy package' /tmp/haproxy34-guard.log
          test ! -e /etc/apt/sources.list.d/easy-ha-proxy-haproxy.list
          # This runner is disposable; provider replacement on a gateway has
          # a separate backup, maintenance and rollback procedure.
          sudo apt-get remove -y --allow-change-held-packages haproxy
      - name: Install the signed package with the installer agent
        run: .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" haproxy/package
      - name: Verify architecture and exercise the real configuration
        run: |
          test "$(dpkg --print-architecture)" = '${{ matrix.arch }}'
          sudo "$RUNNER_TEMP/haproxy-package-smoke"
      - name: Audit server-state restoration on the selected HAProxy 3.4 package
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends socat
          "$RUNNER_TEMP/server-state-smoke" --template ansible/roles/haproxy/templates/haproxy-state-dump.sh.j2 --normalizer "$RUNNER_TEMP/easy-ha-proxy-agent" 2>&1 | tee /tmp/native-state-smoke.log
      - name: Annotate server-state qualification failure
        if: failure()
        run: '"$RUNNER_TEMP/annotate-native-failure" /tmp/native-state-smoke.log'
      - name: Qualify panel prerequisites without replacing the selected provider
        run: .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" packages
      - name: Verify a second installation changes nothing
        run: |
          .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" haproxy/package > /tmp/haproxy34-repeat.log
          cat /tmp/haproxy34-repeat.log
          tail -n 1 /tmp/haproxy34-repeat.log | grep -q '"changed":false'
      - name: Refuse a silent return to the distribution provider
        run: |
          if .tests/integration/agent_part.sh "$RUNNER_TEMP/easy-ha-proxy-agent" haproxy/package distribution > /tmp/haproxy34-rollback-guard.log 2>&1; then
            echo 'A missing provider setting must not replace the vendor package'
            exit 1
          fi
          grep -q 'Refusing to replace an installed HAProxy package' /tmp/haproxy34-rollback-guard.log
          dpkg-query --show --showformat='${Version}' haproxy-awslc | grep -Eq '^3[.]4[.]'
      - name: Qualify vendor and TLS patches against a signed disposable repository
        run: sudo env EHP_MIGRATION_DISPOSABLE=1 EHP_REPO_ROOT="$GITHUB_WORKSPACE" EHP_AGENT="$RUNNER_TEMP/easy-ha-proxy-agent" "$RUNNER_TEMP/haproxymigrate-smoke.test" -test.v -test.run '^TestDisposableHAProxyPatch$'
