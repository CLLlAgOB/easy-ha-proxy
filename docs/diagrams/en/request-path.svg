<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img"><title>easy-ha-proxy: the path of one request</title><desc>A request arrives on port 443. fe_tls_router reads SNI and drops banned addresses, fe_https terminates TLS and applies filters, Lua asks Authelia whether the visitor is logged in, and the site backend sends the request to your server. Every request is logged; guardd reads the log and bans addresses through tbl_ban and ipset, which the entry checks again.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:600}.s{font-size:12px}.p{fill:#444441}.ln{stroke:#888780;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .t{fill:#712B13}.coral .s{fill:#993C1D}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}
.frame{fill:none;stroke:#888780;stroke-dasharray:5 4}.ban{stroke:#D85A30;fill:none}
@media (prefers-color-scheme:dark){
.p{fill:#D3D1C7}.ln{stroke:#B4B2A9}.frame{stroke:#B4B2A9}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .s{fill:#9FE1CB}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t{fill:#EEEDFE}.purple .s{fill:#CECBF6}
.coral rect{fill:#712B13;stroke:#F0997B}.coral .t{fill:#FAECE7}.coral .s{fill:#F5C4B3}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t{fill:#F1EFE8}.gray .s{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="purple"><rect x="80" y="20" width="300" height="56" rx="8" stroke-width="0.75"/><text class="t" x="230.0" y="39" text-anchor="middle" dominant-baseline="central">Accept on :443</text><text class="s" x="230.0" y="60" text-anchor="middle" dominant-baseline="central">fe_tls_router: SNI, drops banned</text></g><path d="M230 76 L230 102" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="purple"><rect x="80" y="106" width="300" height="56" rx="8" stroke-width="0.75"/><text class="t" x="230.0" y="125" text-anchor="middle" dominant-baseline="central">fe_https: TLS and filters</text><text class="s" x="230.0" y="146" text-anchor="middle" dominant-baseline="central">certificate, geo, rate and error limits</text></g><path d="M230 162 L230 188" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="purple"><rect x="80" y="192" width="300" height="56" rx="8" stroke-width="0.75"/><text class="t" x="230.0" y="211" text-anchor="middle" dominant-baseline="central">Login check</text><text class="s" x="230.0" y="232" text-anchor="middle" dominant-baseline="central">Lua → Authelia forward-auth</text></g><path d="M380 220 L426 220" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="gray"><rect x="430" y="192" width="210" height="56" rx="8" stroke-width="0.75"/><text class="t" x="535.0" y="211" text-anchor="middle" dominant-baseline="central">No session</text><text class="s" x="535.0" y="232" text-anchor="middle" dominant-baseline="central">302 to the Authelia login</text></g><path d="M230 248 L230 274" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="purple"><rect x="80" y="278" width="300" height="56" rx="8" stroke-width="0.75"/><text class="t" x="230.0" y="297" text-anchor="middle" dominant-baseline="central">Site backend</text><text class="s" x="230.0" y="318" text-anchor="middle" dominant-baseline="central">balancing, health checks</text></g><path d="M230 334 L230 360" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="gray"><rect x="80" y="364" width="300" height="44" rx="8" stroke-width="0.75"/><text class="t" x="230.0" y="386.0" text-anchor="middle" dominant-baseline="central">Your server</text></g><path d="M80 134 L60 134 L60 456" class="ln" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#a)"/><g class="coral"><rect x="40" y="460" width="200" height="56" rx="8" stroke-width="0.75"/><text class="t" x="140.0" y="479" text-anchor="middle" dominant-baseline="central">HAProxy log</text><text class="s" x="140.0" y="500" text-anchor="middle" dominant-baseline="central">rsyslog → haproxy.log</text></g><path d="M240 488 L266 488" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="coral"><rect x="270" y="460" width="170" height="56" rx="8" stroke-width="0.75"/><text class="t" x="355.0" y="479" text-anchor="middle" dominant-baseline="central">guardd (Rust)</text><text class="s" x="355.0" y="500" text-anchor="middle" dominant-baseline="central">events and decisions</text></g><path d="M440 488 L466 488" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="coral"><rect x="470" y="460" width="170" height="56" rx="8" stroke-width="0.75"/><text class="t" x="555.0" y="479" text-anchor="middle" dominant-baseline="central">Ban</text><text class="s" x="555.0" y="500" text-anchor="middle" dominant-baseline="central">tbl_ban + ipset</text></g><path d="M640 488 L660 488 L660 48 L384 48" class="ban" stroke-width="1.2" marker-end="url(#a)"/></svg>
