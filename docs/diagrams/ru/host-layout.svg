<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img"><title>easy-ha-proxy: что где запущено</title><desc>Трафик из интернета проходит iptables, затем HAProxy на хосте, который отправляет его в Authelia, веб-панель, certbot или на ваши серверы; UDP идёт через DNAT в ядре. Панель управляет корневыми демонами через UNIX-сокеты, а демоны управляют HAProxy.</desc><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:14px;font-weight:600}.s{font-size:12px}.p{fill:#444441}.ln{stroke:#888780;fill:none}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .s{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .t{fill:#3C3489}.purple .s{fill:#534AB7}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .t{fill:#712B13}.coral .s{fill:#993C1D}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .t{fill:#444441}.gray .s{fill:#5F5E5A}
.frame{fill:none;stroke:#888780;stroke-dasharray:5 4}.ban{stroke:#D85A30;fill:none}
@media (prefers-color-scheme:dark){
.p{fill:#D3D1C7}.ln{stroke:#B4B2A9}.frame{stroke:#B4B2A9}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .s{fill:#9FE1CB}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t{fill:#EEEDFE}.purple .s{fill:#CECBF6}
.coral rect{fill:#712B13;stroke:#F0997B}.coral .t{fill:#FAECE7}.coral .s{fill:#F5C4B3}
.gray rect{fill:#444441;stroke:#B4B2A9}.gray .t{fill:#F1EFE8}.gray .s{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="gray"><rect x="180" y="20" width="180" height="44" rx="8" stroke-width="0.75"/><text class="t" x="270.0" y="42.0" text-anchor="middle" dominant-baseline="central">Интернет</text></g><rect class="frame" x="20" y="84" width="500" height="460" rx="20" stroke-width="0.75"/><text class="t p" x="36" y="106" text-anchor="start" dominant-baseline="central">Шлюз (Ubuntu)</text><path d="M270 64 L270 114" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="gray"><rect x="140" y="118" width="260" height="56" rx="8" stroke-width="0.75"/><text class="t" x="270.0" y="137" text-anchor="middle" dominant-baseline="central">iptables (ядро)</text><text class="s" x="270.0" y="158" text-anchor="middle" dominant-baseline="central">бан на 80/443, UDP DNAT</text></g><path d="M270 174 L270 200" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="purple"><rect x="70" y="204" width="400" height="56" rx="8" stroke-width="0.75"/><text class="t" x="270.0" y="223" text-anchor="middle" dominant-baseline="central">HAProxy: пакет на хосте, user haproxy</text><text class="s" x="270.0" y="244" text-anchor="middle" dominant-baseline="central">:80, :443, TCP-порты, /run/haproxy/admin.sock</text></g><g class="gray"><rect x="540" y="204" width="120" height="56" rx="8" stroke-width="0.75"/><text class="t" x="600.0" y="223" text-anchor="middle" dominant-baseline="central">Ваши серверы</text><text class="s" x="600.0" y="244" text-anchor="middle" dominant-baseline="central">бэкенды в LAN</text></g><path d="M470 232 L536 232" class="ln" stroke-width="1.2" marker-end="url(#a)"/><path d="M400 146 L600 146 L600 200" class="ln" stroke-width="1.2" marker-end="url(#a)"/><text class="s p" x="560" y="134" text-anchor="start" dominant-baseline="central">UDP</text><path d="M110 260 L110 296" class="ln" stroke-width="1.2" marker-end="url(#a)"/><path d="M270 260 L270 296" class="ln" stroke-width="1.2" marker-end="url(#a)"/><path d="M430 260 L430 296" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="teal"><rect x="40" y="300" width="140" height="96" rx="8" stroke-width="0.75"/><text class="t" x="110.0" y="319" text-anchor="middle" dominant-baseline="central">Authelia</text><text class="s" x="110.0" y="340" text-anchor="middle" dominant-baseline="central">Docker + Redis</text><text class="s" x="110.0" y="358" text-anchor="middle" dominant-baseline="central">uid 19010</text><text class="s" x="110.0" y="376" text-anchor="middle" dominant-baseline="central">127.0.0.1:9091</text></g><g class="teal"><rect x="200" y="300" width="140" height="96" rx="8" stroke-width="0.75"/><text class="t" x="270.0" y="319" text-anchor="middle" dominant-baseline="central">Веб-панель</text><text class="s" x="270.0" y="340" text-anchor="middle" dominant-baseline="central">Go в Docker</text><text class="s" x="270.0" y="358" text-anchor="middle" dominant-baseline="central">user haproxyadmin</text><text class="s" x="270.0" y="376" text-anchor="middle" dominant-baseline="central">127.0.0.1:5000</text></g><g class="purple"><rect x="360" y="300" width="140" height="96" rx="8" stroke-width="0.75"/><text class="t" x="430.0" y="319" text-anchor="middle" dominant-baseline="central">certbot</text><text class="s" x="430.0" y="340" text-anchor="middle" dominant-baseline="central">snap на хосте</text><text class="s" x="430.0" y="358" text-anchor="middle" dominant-baseline="central">root</text><text class="s" x="430.0" y="376" text-anchor="middle" dominant-baseline="central">127.0.0.1:8000</text></g><path d="M270 396 L270 426" class="ln" stroke-width="1.2" marker-end="url(#a)"/><text class="s p" x="280" y="412" text-anchor="start" dominant-baseline="central">UNIX-сокеты в /run/easy-ha-proxy</text><g class="purple"><rect x="40" y="430" width="460" height="92" rx="8" stroke-width="0.75"/><text class="t" x="270.0" y="449" text-anchor="middle" dominant-baseline="central">Демоны systemd: root, группа hadmin</text><text class="s" x="270.0" y="470" text-anchor="middle" dominant-baseline="central">Go-агент: controld, certd, updated, backupd, alertd,</text><text class="s" x="270.0" y="488" text-anchor="middle" dominant-baseline="central">metricsd, healthd, authelia-usersd / configd / bansd</text><text class="s" x="270.0" y="506" text-anchor="middle" dominant-baseline="central">Rust: guardd (адаптивная защита)</text></g><path d="M40 476 L30 476 L30 232 L66 232" class="ln" stroke-width="1.2" marker-end="url(#a)"/><g class="teal"><rect x="40" y="562" width="14" height="14" rx="3" stroke-width="0.75"/></g><text class="s p" x="62" y="569" text-anchor="start" dominant-baseline="central">Docker-контейнер</text><g class="purple"><rect x="200" y="562" width="14" height="14" rx="3" stroke-width="0.75"/></g><text class="s p" x="222" y="569" text-anchor="start" dominant-baseline="central">процесс на хосте</text><g class="gray"><rect x="360" y="562" width="14" height="14" rx="3" stroke-width="0.75"/></g><text class="s p" x="382" y="569" text-anchor="start" dominant-baseline="central">снаружи или сеть</text></svg>
